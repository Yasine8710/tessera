services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: caresync
      POSTGRES_PASSWORD: caresync_dev_only
      POSTGRES_DB: caresync
    ports:
      - "5433:5432"
    volumes:
      - caresync_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caresync"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  caresync_pg:
