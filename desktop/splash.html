<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>Tessera</title>
<style>
  :root { --bg: #0e1218; --ink: #e8ebf0; --muted: #98a2b2; --accent: #7aa5e6; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f5f7; --ink: #151a22; --muted: #596273; --accent: #2557a7; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; overflow: hidden; -webkit-app-region: drag; }
  .stage { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  svg { width: 112px; height: 112px; overflow: visible; }
  .t { fill: var(--ink); opacity: 0; transform-box: fill-box; transform-origin: center; animation: tile 520ms cubic-bezier(.2,.7,.2,1) forwards; }
  .t.a { fill: var(--accent); }
  .t:nth-child(1) { animation-delay: 80ms; } .t:nth-child(2) { animation-delay: 190ms; } .t:nth-child(3) { animation-delay: 300ms; }
  .t:nth-child(4) { animation-delay: 410ms; } .t:nth-child(5) { animation-delay: 560ms; }
  @keyframes tile { from { opacity: 0; transform: scale(.4) translateY(10px); } to { opacity: 1; transform: none; } }
  .name { font-size: 30px; font-weight: 620; letter-spacing: .02em; opacity: 0; animation: rise 600ms 700ms cubic-bezier(.2,.7,.2,1) forwards; }
  .sub { margin-top: -18px; font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; opacity: 0; animation: rise 600ms 900ms cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .bar { width: 160px; height: 2px; background: color-mix(in srgb, var(--muted) 30%, transparent); border-radius: 2px; overflow: hidden; opacity: 0; animation: rise 400ms 1000ms forwards; }
  .bar i { display: block; height: 100%; width: 40%; background: var(--accent); animation: slide 1.1s 1000ms ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; animation-delay: 0ms !important; } }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect class="t" x="4" y="4" width="16" height="16" rx="2.5"/>
      <rect class="t" x="24" y="4" width="16" height="16" rx="2.5"/>
      <rect class="t" x="44" y="4" width="16" height="16" rx="2.5"/>
      <rect class="t" x="24" y="24" width="16" height="16" rx="2.5"/>
      <rect class="t a" x="24" y="44" width="16" height="16" rx="2.5"/>
    </svg>
    <div class="name">Tessera</div>
    <div class="sub">Connected care</div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
